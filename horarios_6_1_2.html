<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --onInk:#FFFFFF; --sub:#8E8E93; --faint:#C7C7CC;
  --line:#E5E5EA; --stroke:#1C1C1E; --fill:#EFEFF4; --glass:rgba(242,242,247,.82);
  --em1:#0A84FF; --em2:#5E5CE6; --onEm:#FFFFFF; --emSub:rgba(255,255,255,.72);
  --red:#FFFFFF; --accInk:#0A84FF;
  --sh1:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --sh2:0 2px 6px rgba(10,132,255,.18), 0 16px 34px rgba(60,80,230,.30);
  --hi:inset 0 1px 0 rgba(255,255,255,.14);
  --overlay:rgba(0,0,0,.35);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --ink:#F2F2F7; --onInk:#000000; --sub:#8E8E93; --faint:#48484A;
    --line:#2C2C2E; --stroke:#F2F2F7; --fill:#2C2C2E; --glass:rgba(0,0,0,.8);
    --em1:#0A84FF; --em2:#5E5CE6; --onEm:#FFFFFF; --emSub:rgba(255,255,255,.72);
    --red:#FFFFFF; --accInk:#0A84FF;
    --sh1:inset 0 1px 0 rgba(255,255,255,.04); --sh2:0 14px 32px rgba(10,132,255,.25);
    --hi:inset 0 1px 0 rgba(255,255,255,.1);
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --ink:#F2F2F7; --onInk:#000000; --sub:#8E8E93; --faint:#48484A;
    --line:#2C2C2E; --stroke:#F2F2F7; --fill:#2C2C2E; --glass:rgba(0,0,0,.8);
    --em1:#0A84FF; --em2:#5E5CE6; --onEm:#FFFFFF; --emSub:rgba(255,255,255,.72);
    --red:#FFFFFF; --accInk:#0A84FF;
    --sh1:inset 0 1px 0 rgba(255,255,255,.04); --sh2:0 14px 32px rgba(10,132,255,.25);
  --hi:inset 0 1px 0 rgba(255,255,255,.1);
  --overlay:rgba(0,0,0,.6);
}
html,body{height:100%;}
html{overscroll-behavior-y:none;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; min-height:100%; overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 36px);
}
body::before{content:""; position:fixed; left:0; right:0; top:0; height:320px; pointer-events:none; z-index:0;
  background:radial-gradient(90% 60% at 85% 0%, rgba(255,255,255,.85), transparent 70%);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::before{background:radial-gradient(90% 60% at 85% 0%, rgba(255,255,255,.06), transparent 70%);} }
:root[data-theme="dark"] body::before{background:radial-gradient(90% 60% at 85% 0%, rgba(255,255,255,.06), transparent 70%);}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer;}
main{max-width:520px; margin:0 auto; padding:0 18px; position:relative; z-index:1;}
.num{font-variant-numeric:tabular-nums;}

/* compact bar on scroll */
.bar{
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line); text-align:center; font-size:15px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity .2s, transform .2s;
}
.bar.show{opacity:1; transform:none;}

/* header */
.top{padding:28px 2px 22px; display:flex; align-items:flex-end; justify-content:space-between;}
.hello{font-size:16px; font-weight:400; color:var(--ink);}
h1{font-size:40px; font-weight:800; letter-spacing:-.035em; margin:2px 0 0; line-height:1;}
.sub{font-size:15px; color:var(--sub); margin-top:6px;}
.clock{
  font-size:14px; font-weight:700; padding:9px 14px; border-radius:30px; margin-bottom:4px;
  background:var(--card); box-shadow:var(--sh1); display:flex; align-items:center; gap:8px;
}
.clock i{width:7px; height:7px; border-radius:50%; background:var(--red); animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.label{font-size:17px; font-weight:700; margin:26px 4px 12px; display:flex; justify-content:space-between; align-items:baseline;}
.label small{font-size:13px; font-weight:500; color:var(--sub);}

/* lines: outlined card */
.lines{background:var(--card); border-radius:26px; box-shadow:var(--sh1); padding:6px;}
.lineRow{width:100%; display:flex; align-items:center; gap:14px; padding:15px 14px; border-radius:20px; text-align:left; position:relative; transition:background .15s;}
.lineRow + .lineRow::before{content:""; position:absolute; top:0; left:50px; right:14px; height:1px; background:var(--line);}
.lineRow:not(.active):active{background:var(--fill);}
.radio{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--faint); flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--onInk); transition:all .2s;}
.radio svg{width:12px; height:12px; opacity:0;}
.lrText{flex:1; min-width:0;}
.lrName{font-size:15px; font-weight:600; line-height:1.3;}
.lrSub{font-size:12.5px; color:var(--sub); margin-top:3px;}

.lineRow.active{background:linear-gradient(140deg, var(--em1) 0%, var(--em2) 100%); color:var(--onEm); padding:18px 14px; box-shadow:var(--sh2); margin:2px 0;}
.lineRow.active::before, .lineRow.active + .lineRow::before{display:none;}
.lineRow.active .radio{background:var(--red); border-color:var(--red); color:var(--accInk);}
.lineRow.active .route .k, .lineRow.active .route .arrow, .lineRow.active .swap small{color:var(--emSub);}
.lineRow.active .radio svg{opacity:1;}
.route{display:flex; flex-direction:column; gap:2px;}
.route .k{font-size:11.5px; color:var(--sub); font-weight:500;}
.route .n{font-size:16px; font-weight:700; letter-spacing:-.01em; line-height:1.25; transition:opacity .18s, transform .22s;}
.route .arrow{display:flex; align-items:center; gap:6px; color:var(--sub); font-size:11.5px; margin:4px 0;}
.route .arrow svg{width:13px; height:13px;}
.fade .n{opacity:0; transform:translateY(3px);}
.swap{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px;
}
.swap span{
  width:46px; height:46px; border-radius:50%; background:var(--red); color:var(--accInk); box-shadow:0 6px 16px rgba(0,0,0,.18);
  display:flex; align-items:center; justify-content:center; transition:transform .45s cubic-bezier(.3,1.4,.5,1);
}
.swap svg{width:19px; height:19px;}
.swap small{font-size:10.5px; font-weight:600; color:var(--sub);}
.swap:active span{transform:scale(.9);}
.swap.spin span{transform:rotate(180deg);}

/* next card */
.next{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; margin-top:16px;
  padding:20px 18px 20px 22px; border-radius:26px; color:var(--onEm); transition:transform .15s; position:relative; overflow:hidden;
  background:linear-gradient(140deg, var(--em1) 0%, var(--em2) 100%); box-shadow:var(--sh2);
}
.next:active{transform:scale(.98);}
.next::before{content:""; position:absolute; right:-60px; top:-80px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events:none;}
.nText{flex:1; min-width:0; position:relative;}
.nK{font-size:13px; font-weight:500; color:var(--emSub);}
.nBig{display:flex; align-items:baseline; gap:6px; margin-top:4px;}
.nBig .p{font-size:17px; font-weight:600; opacity:.85;}
.nBig .v{font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1;}
.nBig .u{font-size:17px; font-weight:700;}
.nTime{font-size:13px; font-weight:600; color:var(--emSub); margin-top:6px;}
.nGo{width:44px; height:44px; border-radius:50%; background:var(--onInk); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.nGo svg{width:18px; height:18px;}
.done{margin-top:16px; padding:20px; border-radius:24px; background:var(--card); box-shadow:var(--sh1); text-align:center;}
.done b{display:block; font-size:16px;}
.done span{font-size:13px; color:var(--sub);}

/* days */
.dayRow{display:flex; gap:8px;}
.daybtn{flex:1; padding:12px 4px; border-radius:40px; background:var(--card); box-shadow:var(--sh1); font-size:13.5px; font-weight:600; color:var(--sub); transition:all .2s;}
.daybtn.active{background:linear-gradient(140deg, var(--em1) 0%, var(--em2) 100%); color:var(--onEm); box-shadow:var(--sh2);}

/* times */
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;}
.t{padding:14px 0; border-radius:16px; background:var(--card); box-shadow:var(--sh1); font-size:17px; font-weight:700; text-align:center; transition:transform .15s;}
.t:active{transform:scale(.94);}
.t.past{color:var(--faint); background:transparent; box-shadow:inset 0 0 0 1.5px var(--line);}
.t.nx{background:linear-gradient(140deg, var(--em1) 0%, var(--em2) 100%); color:var(--onEm); box-shadow:var(--sh2);}
.hint{font-size:12.5px; color:var(--sub); text-align:center; margin:18px 0 0;}
.empty{margin-top:14px; padding:30px 16px; text-align:center; color:var(--sub); font-size:14px; border-radius:22px; background:var(--card); box-shadow:var(--sh1);}
.note{display:flex; gap:10px; font-size:12.5px; color:var(--sub); line-height:1.5; margin:22px 0 0; padding:14px 16px; border-radius:18px; background:var(--card); box-shadow:var(--sh1);}
.note svg{width:16px; height:16px; flex:0 0 auto; color:#0A84FF; margin-top:1px;}
.note:empty{display:none;}

/* sheet */
#modalOverlay{position:fixed; inset:0; background:var(--overlay); z-index:20; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s;}
#modalOverlay.show{opacity:1; pointer-events:auto;}
#sheet{
  width:100%; max-width:520px; background:var(--card); box-shadow:0 -10px 40px rgba(0,0,0,.2); border-radius:28px 28px 0 0;
  padding:8px 0 calc(20px + env(safe-area-inset-bottom,0px)); max-height:84vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .4s cubic-bezier(.2,.9,.25,1);
}
#modalOverlay.show #sheet{transform:translateY(0);}
.handle{width:36px; height:5px; border-radius:3px; background:var(--faint); margin:0 auto 16px; opacity:.6;}
.sHead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:0 18px 16px 22px;}
.sHead .k{font-size:13px; color:var(--sub);}
.sHead .tt{font-size:36px; font-weight:800; letter-spacing:-.03em; line-height:1; margin-top:4px;}
.sHead .s{font-size:13px; color:var(--sub); margin-top:6px;}
.close{width:36px; height:36px; border-radius:50%; background:var(--fill); color:var(--sub); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.close svg{width:13px; height:13px;}
.stops{position:relative; margin:0 16px; padding:6px 0; border-radius:22px; background:var(--fill);}
.stopsLine{position:absolute; left:26px; width:1.5px; background:var(--faint);}
.stop{position:relative; display:flex; align-items:center; gap:14px; padding:12px 18px 12px 20px;}
.sd{width:14px; height:14px; border-radius:50%; background:var(--fill); border:1.5px solid var(--sub); flex:0 0 auto; position:relative; z-index:1;}
.stop.first .sd{border:3px solid var(--ink);}
.stop.last .sd{background:var(--ink); border-color:var(--ink); box-shadow:0 0 0 4px var(--line);}
.sn{flex:1; font-size:15px;}
.stop.first .sn, .stop.last .sn{font-weight:700;}
.st{font-size:15px; font-weight:600; color:var(--sub);}
.stop.first .st, .stop.last .st{color:var(--ink); font-weight:700;}
.clock i{background:#34C759 !important;}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main>
  <div class="top">
    <div>
      <div class="hello">Horários de</div>
      <h1>BusIns</h1>
    </div>
    <div class="clock num"><i></i><span id="clock"></span></div>
  </div>

  <div class="label" style="margin-top:4px">Linhas</div>
  <div class="lines" id="lines"></div>

  <div id="nextBox"></div>

  <div class="label">Partidas <small id="count"></small></div>
  <div class="dayRow" id="dayRow"></div>
  <div id="content"></div>
  <div class="note" id="note"></div>
</main>

<div id="modalOverlay">
  <div id="sheet">
    <div class="handle"></div>
    <div class="sHead">

: {"du": [["07:45", "07:55", "08:13", "08:16", "08:17", "08:35"], ["08:45", "08:55", "09:15", "09:18", "09:20", "09:40"], ["10:00", "10:15", "10:35", "10:41", "10:42", "11:00"], ["11:00", "11:15", "11:35", "11:41", "11:42", "12:00"], ["11:30", "11:43", "12:00", "12:03", "12:04", "12:25"], ["13:00", "13:13", "13:30", "13:33", "13:34", "13:55"], ["13:30", "13:43", "14:00", "14:03", "14:04", "14:25"], ["14:00", "14:13", "14:30", "14:33", "14:34", "14:55"], ["15:00", "15:13", "15:30", "15:33", "15:34", "15:55"], ["15:30", "15:43", "16:00", "16:03", "16:04", "16:25"], ["17:00", "17:15", "17:35", "17:41", "17:42", "18:05"], ["17:30", "17:45", "18:05", "18:11", "18:12", "18:35"], ["18:00", "18:15", "18:35", "18:41", "18:42", "19:05"], ["18:30", "18:45", "19:05", "19:11", "19:12", "19:30"], ["19:00", "19:15", "19:35", "19:41", "19:42", "20:00"], ["19:30", "19:45", "20:05", "20:11", "20:12", "20:30"], ["20:30", "20:40", "21:00", "21:04", "21:05", "21:20"], ["21:30", "21:40", "22:00", "22:03", "22:04", "22:15"]], "sab": [["07:55", "08:04", "08:20", "08:23", "08:24", "08:40"], ["10:00", "10:08", "10:25", "10:27", "10:28", "10:55"], ["16:30", "16:40", "17:00", "17:03", "17:04", "17:20"], ["18:30", "18:40", "19:00", "19:03", "19:04", "19:20"]], "dom": [["09:00", "09:09", "09:25", "09:27", "09:28", "09:45"], ["14:00", "14:08", "14:25", "14:27", "14:28", "14:45"], ["20:00", "20:10", "20:20", "20:23", "20:24", "20:50"]]}}}}};
const DAYS = {du:"Dias úteis", sab:"Sábado", dom:"Domingo"};
const I = {
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  swap:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M21 16l-4 4-4-4"/></svg>`,
  down:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>`,
  go:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  info:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>`
};
const order = Object.keys(DATA);
let state = {line:"1223", dir:"ida", day:today(), spin:false};

function today(){ const d=new Date().getDay(); return d===0?"dom":d===6?"sab":"du"; }
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function pad(n){ return String(n).padStart(2,"0"); }
function ends(d){ const p=d.label.split("→").map(s=>s.trim()); return p.length===2?p:[d.label,""]; }

function renderLines(){
  const box = document.getElementById("lines");
  box.innerHTML = order.map(k=>{
    const l = DATA[k];
    if(k===state.line){
      const [a,b] = ends(l.dirs[state.dir]);
      return `<div class="lineRow active" data-k="${k}">
        <span class="radio">${I.check}</span>
        <div class="lrText route" id="route">
          <span class="k">De</span><span class="n">${a}</span>
          <span class="arrow">${I.down}</span>
          <span class="k">Para</span><span class="n">${b}</span>
        </div>
        <button class="swap ${state.spin?"spin":""}" id="swap" aria-label="Inverter sentido"><span>${I.swap}</span><small>Inverter</small></button>
      </div>`;
    }
    return `<button class="lineRow" data-k="${k}">
      <span class="radio">${I.check}</span>
      <span class="lrText"><div class="lrName">${l.name.replace(" - "," ↔ ")}</div><div class="lrSub">${l.tagline}</div></span>
    </button>`;
  }).join("");
  box.querySelectorAll("button.lineRow").forEach(b=> b.onclick = ()=>{
    state.line=b.dataset.k; state.dir="ida"; state.spin=false;
    renderLines(); renderTimes();
  });
  const [a,b] = ends(DATA[state.line].dirs[state.dir]);
  document.getElementById("bar").textContent = `${a} → ${b}`;
  document.getElementById("swap").onclick = ()=>{
    state.dir = state.dir==="ida"?"volta":"ida";
    state.spin = !state.spin;
    if(navigator.vibrate) navigator.vibrate(8);
    const btn = document.getElementById("swap");
    btn.classList.toggle("spin", state.spin);
    document.getElementById("route").classList.add("fade");
    setTimeout(()=>{ renderLines(); renderTimes(); }, 170);
  };
}

function renderDays(){
  const box = document.getElementById("dayRow");
  box.innerHTML = "";
  Object.keys(DAYS).forEach(d=>{
    const b = document.createElement("button");
    b.className = "daybtn" + (d===state.day?" active":"");
    b.textContent = DAYS[d];
    b.onclick = ()=>{ state.day=d; renderTimes(); };
    box.appendChild(b);
  });
}

function renderNext(){
  const dirData = DATA[state.line].dirs[state.dir];
  const trips = dirData.trips[today()] || [];
  const now = nowMin();
  const i = trips.findIndex(t=>toMin(t[0])>=now);
  const box = document.getElementById("nextBox");
  if(i===-1){
    box.innerHTML = `<div class="done"><b>Sem mais partidas hoje</b><span>${trips.length ? "Consulta os horários abaixo." : "Esta linha não circula hoje."}</span></div>`;
    return;
  }
  const dep = trips[i][0], d = toMin(dep)-now, h = Math.floor(d/60), m = d%60;
  const big = d===0 ? `<span class="v">Agora</span>`
    : h ? `<span class="p">daqui a</span><span class="v num">${h}h${m?pad(m):""}</span>`
    : `<span class="p">daqui a</span><span class="v num">${m}</span><span class="u">min</span>`;
  box.innerHTML = `<button class="next" id="nextBtn">
      <div class="nText"><div class="nK">Próximo autocarro</div><div class="nBig">${big}</div><div class="nTime num">Parte às ${dep}</div></div>
    </button>`;
  document.getElementById("nextBtn").onclick = ()=> openStops(dirData, trips[i]);
}

function renderTimes(){
  renderDays(); renderNext();
  const line = DATA[state.line];
  const dirData = line.dirs[state.dir];
  const trips = dirData.trips[state.day] || [];
  document.getElementById("note").innerHTML = line.note ? `${I.info}<span>${line.note}</span>` : "";
  document.getElementById("count").textContent = trips.length ? `${trips.length} horários` : "";
  const box = document.getElementById("content");
  if(!trips.length){ box.innerHTML = `<div class="empty">Sem serviço neste dia.</div>`; return; }
  const now = nowMin(), isToday = state.day===today();
  const nx = isToday ? trips.findIndex(t=>toMin(t[0])>=now) : -1;
  box.innerHTML = `<div class="grid">` + trips.map((t,i)=>{
    const past = isToday && (nx===-1 || i<nx);
    return `<button class="t num ${past?"past":""} ${i===nx?"nx":""}" data-i="${i}">${t[0]}</button>`;
  }).join("") + `</div><p class="hint">Toca numa hora para ver as paragens</p>`;
  box.querySelectorAll("[data-i]").forEach(b=> b.onclick = ()=> openStops(dirData, trips[+b.dataset.i]));
}

function closeSheet(){ document.getElementById("modalOverlay").classList.remove("show"); }
function openStops(dirData, trip){
  const stops = dirData.stops;
  document.getElementById("sT").textContent = trip[0];
  document.getElementById("sS").textContent = `${dirData.label} · ${stops.length} paragens`;
  const box = document.getElementById("stops");
  box.innerHTML = stops.map((n,i)=>`<div class="stop ${i===0?"first":i===stops.length-1?"last":""}"><span class="sd"></span><span class="sn">${n}</span><span class="st num">${trip[i]}</span></div>`).join("");
  document.getElementById("modalOverlay").classList.add("show");
  requestAnimationFrame(()=>{
    const r = box.querySelectorAll(".sd"); if(r.length<2) return;
    const top = document.querySelector(".stops").getBoundingClientRect().top;
    const a=r[0].getBoundingClientRect(), b=r[r.length-1].getBoundingClientRect();
    const l=document.getElementById("stopsLine");
    l.style.top=(a.top+a.height/2-top)+"px"; l.style.height=(b.top-a.top)+"px";
  });
}
document.getElementById("close").onclick = closeSheet;
document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeSheet(); });
(function(){
  const s=document.getElementById("sheet"); let y0=null, dy=0;
  s.addEventListener("touchstart",e=>{ if(s.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; s.style.transition="none"; } },{passive:true});
  s.addEventListener("touchmove",e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); s.style.transform=`translateY(${dy}px)`; },{passive:true});
  s.addEventListener("touchend",()=>{ if(y0===null) return; s.style.transition=""; s.style.transform=""; if(dy>90) closeSheet(); y0=null; });
})();
addEventListener("scroll", ()=> document.getElementById("bar").classList.toggle("show", scrollY > 80), {passive:true});

function tick(){ const n=new Date(); document.getElementById("clock").textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`; }
tick(); renderLines(); renderTimes();
setInterval(()=>{ tick(); renderTimes(); }, 30000);
</script>
</body>
</html>
